<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>单摆模拟器 - 故障演练</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Consolas', 'Courier New', monospace;
    color: #7a8aaa;
    overflow: hidden;
  }
  canvas {
    display: block;
    border-radius: 8px;
  }
  .controls {
    margin-top: 20px;
  }
  .btn-reset {
    padding: 10px 24px;
    background: rgba(106, 236, 192, 0.15);
    border: 1px solid rgba(106, 236, 192, 0.4);
    color: #8af0c8;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reset:hover {
    background: rgba(106, 236, 192, 0.25);
    box-shadow: 0 0 12px rgba(106, 236, 192, 0.3);
  }
</style>
</head>
<body>

<canvas id="sim"></canvas>

<div class="controls">
  <button class="btn-reset">重置摆动</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');

  canvas.width = 600;
  canvas.height = 450;

  const L = 180;
  const g = 9.8;
  const DAMPING = 0.999;
  const DT = 0.016;

  const pivotX = canvas.width / 2;
  const pivotY = canvas.height * 0.2;

  let theta = Math.PI / 4;
  let omega = 0;

  function resetAnimation() {
    theta = Math.PI / 4;
    omega = 0;
  }

  document.querySelector('.btn-reset').addEventListener('click', resetAnimation);

  function physics() {
    const alpha = -(g / L) * Math.sin(theta);
    omega += alpha * DT;
    omega *= DAMPING;
    theta += omega * DT;
  }

  function draw() {
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const bobX = pivotX + L * Math.sin(theta);
    const bobY = pivotY + L * Math.cos(theta);

    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(bobX, bobY);
    ctx.strokeStyle = 'rgba(120, 150, 200, 0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(pivotX, pivotY, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#4a5a7a';
    ctx.fill();

    ctx.save();
    ctx.shadowColor = 'rgba(100, 240, 200, 0.8)';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.arc(bobX, bobY, 16, 0, Math.PI * 2);
    ctx.fillStyle = '#6aecc0';
    ctx.fill();
    ctx.restore();
  }

  function loop() {
    physics();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>

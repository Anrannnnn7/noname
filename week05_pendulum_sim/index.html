<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>单摆模拟器 - Week 05</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Consolas', 'Courier New', monospace;
    color: #7a8aaa;
    overflow: hidden;
  }
  canvas {
    display: block;
    border-radius: 8px;
  }
  .hud {
    position: fixed;
    top: 20px;
    left: 24px;
    font-size: 12px;
    line-height: 1.8;
    letter-spacing: 0.5px;
    opacity: 0.75;
  }
  .hud .label { color: #4a5a7a; }
  .hud .value { color: #8af0c8; }
  .title-bar {
    position: fixed;
    top: 20px;
    right: 24px;
    text-align: right;
    font-size: 11px;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="hud">
  <div><span class="label">摆长 L :</span> <span class="value" id="h-len">200 px</span></div>
  <div><span class="label">重力 g :</span> <span class="value" id="h-g">9.80 m/s²</span></div>
  <div><span class="label">摆角 θ :</span> <span class="value" id="h-theta">45.00°</span></div>
  <div><span class="label">角速度 ω:</span> <span class="value" id="h-omega">0.00 rad/s</span></div>
</div>

<div class="title-bar">
  WEEK 05 · PENDULUM SIM<br>
  郭梓萌 / 7902126161
</div>

<canvas id="sim"></canvas>

<script>
(() => {
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');

  const W = Math.min(window.innerWidth, 900);
  const H = Math.min(window.innerHeight, 700);
  canvas.width = W;
  canvas.height = H;

  const L = 200;
  const g = 9.8;
  const DAMPING = 0.9992;
  const DT = 0.016;
  const BOB_RADIUS = 18;

  const pivotX = W / 2;
  const pivotY = H * 0.18;

  let theta = Math.PI / 4;
  let omega = 0;

  const trail = [];
  const MAX_TRAIL = 60;

  function physics() {
    const alpha = -(g / L) * Math.sin(theta);
    omega += alpha * DT;
    omega *= DAMPING;
    theta += omega * DT;
  }

  function bobPos() {
    return {
      x: pivotX + L * Math.sin(theta),
      y: pivotY + L * Math.cos(theta)
    };
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(80, 100, 140, 0.06)';
    ctx.lineWidth = 1;
    const step = 40;
    for (let x = 0; x < W; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function drawPivot() {
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#4a5a7a';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pivotX - 30, pivotY);
    ctx.lineTo(pivotX + 30, pivotY);
    ctx.strokeStyle = 'rgba(100, 130, 180, 0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawRod(bob) {
    const grad = ctx.createLinearGradient(pivotX, pivotY, bob.x, bob.y);
    grad.addColorStop(0, 'rgba(120, 150, 200, 0.4)');
    grad.addColorStop(1, 'rgba(120, 150, 200, 0.8)');
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(bob.x, bob.y);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawTrail(bob) {
    trail.push({ x: bob.x, y: bob.y });
    if (trail.length > MAX_TRAIL) trail.shift();

    for (let i = 0; i < trail.length - 1; i++) {
      const t = i / trail.length;
      ctx.beginPath();
      ctx.moveTo(trail[i].x, trail[i].y);
      ctx.lineTo(trail[i + 1].x, trail[i + 1].y);
      ctx.strokeStyle = `rgba(100, 220, 180, ${t * 0.35})`;
      ctx.lineWidth = t * 4;
      ctx.stroke();
    }
  }

  function drawBob(bob) {
    ctx.save();
    ctx.shadowColor = 'rgba(100, 240, 200, 0.9)';
    ctx.shadowBlur = 30;

    const grad = ctx.createRadialGradient(
      bob.x - 4, bob.y - 4, 2,
      bob.x, bob.y, BOB_RADIUS
    );
    grad.addColorStop(0, '#d0fff0');
    grad.addColorStop(0.4, '#6aecc0');
    grad.addColorStop(1, '#2a8a7a');

    ctx.beginPath();
    ctx.arc(bob.x, bob.y, BOB_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(bob.x, bob.y, BOB_RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(160, 255, 220, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawArcGuide() {
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, L, 0, Math.PI, false);
    ctx.strokeStyle = 'rgba(80, 110, 160, 0.08)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function updateHUD() {
    document.getElementById('h-theta').textContent =
      (theta * 180 / Math.PI).toFixed(2) + '°';
    document.getElementById('h-omega').textContent =
      omega.toFixed(2) + ' rad/s';
  }

  function frame() {
    physics();

    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);

    drawGrid();
    drawArcGuide();
    drawPivot();

    const bob = bobPos();
    drawTrail(bob);
    drawRod(bob);
    drawBob(bob);

    updateHUD();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

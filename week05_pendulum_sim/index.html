<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>单摆模拟器 - Week 05</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Consolas', 'Courier New', monospace;
    color: #7a8aaa;
    overflow: hidden;
  }
  canvas {
    display: block;
    border-radius: 8px;
  }
  .hud {
    position: fixed;
    top: 20px;
    left: 24px;
    font-size: 12px;
    line-height: 1.8;
    letter-spacing: 0.5px;
    opacity: 0.75;
  }
  .hud .label { color: #4a5a7a; }
  .hud .value { color: #8af0c8; }
  .title-bar {
    position: fixed;
    top: 20px;
    right: 24px;
    text-align: right;
    font-size: 11px;
    opacity: 0.5;
  }
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 28px;
    align-items: center;
    padding: 16px 24px;
    background: rgba(30, 32, 45, 0.6);
    border-radius: 8px;
    border: 1px solid rgba(80, 100, 140, 0.15);
  }
  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 140px;
  }
  .slider-group label {
    font-size: 11px;
    color: #5a6a8a;
    letter-spacing: 0.5px;
  }
  .slider-group label span {
    color: #8af0c8;
    font-weight: bold;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(80, 100, 140, 0.3);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    background: #6aecc0;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(106, 236, 192, 0.5);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    background: #6aecc0;
    border-radius: 50%;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 8px rgba(106, 236, 192, 0.5);
  }
  .btn-reset {
    padding: 8px 20px;
    background: rgba(106, 236, 192, 0.15);
    border: 1px solid rgba(106, 236, 192, 0.4);
    color: #8af0c8;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reset:hover {
    background: rgba(106, 236, 192, 0.25);
    box-shadow: 0 0 12px rgba(106, 236, 192, 0.3);
  }
  .presets {
    margin-top: 12px;
    display: flex;
    gap: 12px;
  }
  .btn-preset {
    padding: 6px 16px;
    background: rgba(80, 100, 140, 0.1);
    border: 1px solid rgba(80, 100, 140, 0.3);
    color: #7a8aaa;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.5px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-preset:hover {
    background: rgba(106, 236, 192, 0.15);
    border-color: rgba(106, 236, 192, 0.4);
    color: #8af0c8;
  }
  .btn-preset.active {
    background: rgba(106, 236, 192, 0.2);
    border-color: rgba(106, 236, 192, 0.5);
    color: #8af0c8;
    box-shadow: 0 0 10px rgba(106, 236, 192, 0.2);
  }
</style>
</head>
<body>

<div class="hud">
  <div><span class="label">摆长 L :</span> <span class="value" id="h-len">200 px</span></div>
  <div><span class="label">重力 g :</span> <span class="value" id="h-g">9.80 m/s²</span></div>
  <div><span class="label">摆角 θ :</span> <span class="value" id="h-theta">45.00°</span></div>
  <div><span class="label">角速度 ω:</span> <span class="value" id="h-omega">0.00 rad/s</span></div>
</div>

<div class="title-bar">
  WEEK 05 · PENDULUM SIM<br>
  郭梓萌 / 7902126161
</div>

<canvas id="sim"></canvas>

<div class="controls">
  <div class="slider-group">
    <label>摆长: <span id="val-len">200</span> px</label>
    <input type="range" id="slider-len" min="100" max="350" value="200" step="1">
  </div>
  <div class="slider-group">
    <label>重力: <span id="val-g">9.80</span> m/s²</label>
    <input type="range" id="slider-g" min="1" max="25" value="9.8" step="0.1">
  </div>
  <div class="slider-group">
    <label>阻尼: <span id="val-damp">0.0008</span></label>
    <input type="range" id="slider-damp" min="0" max="0.010" value="0.0008" step="0.0001">
  </div>
  <button class="btn-reset" id="btn-reset">重置摆动</button>
</div>

<div class="presets">
  <button class="btn-preset active" data-g="9.8">地球</button>
  <button class="btn-preset" data-g="1.62">月球</button>
  <button class="btn-preset" data-g="24.79">木星</button>
  <button class="btn-preset" data-g="0.1">太空</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');

  const W = Math.min(window.innerWidth, 900);
  const H = Math.min(window.innerHeight - 120, 600);
  canvas.width = W;
  canvas.height = H;

  const DEFAULTS = { L: 200, g: 9.8, k: 0.001 };
  const saved = JSON.parse(localStorage.getItem('pendulum_params') || 'null');
  const params = saved || DEFAULTS;

  let L = params.L;
  let g = params.g;
  let DAMPING = 1 - params.k;
  const DT = 0.016;
  const BOB_RADIUS = 18;

  const pivotX = W / 2;
  const pivotY = H * 0.18;

  let theta = Math.PI / 4;
  let omega = 0;

  const trail = [];
  const MAX_TRAIL = 60;

  function saveParams() {
    localStorage.setItem('pendulum_params', JSON.stringify({
      L: L,
      g: g,
      k: 1 - DAMPING
    }));
  }

  const sliderLen = document.getElementById('slider-len');
  const sliderG = document.getElementById('slider-g');
  const sliderDamp = document.getElementById('slider-damp');
  const valLen = document.getElementById('val-len');
  const valG = document.getElementById('val-g');
  const valDamp = document.getElementById('val-damp');
  const btnReset = document.getElementById('btn-reset');

  sliderLen.value = L;
  sliderG.value = g;
  sliderDamp.value = 1 - DAMPING;
  valLen.textContent = L;
  valG.textContent = g.toFixed(2);
  valDamp.textContent = (1 - DAMPING).toFixed(4);

  sliderLen.addEventListener('input', (e) => {
    L = parseFloat(e.target.value);
    valLen.textContent = L;
    trail.length = 0;
    saveParams();
  });

  sliderG.addEventListener('input', (e) => {
    g = parseFloat(e.target.value);
    valG.textContent = g.toFixed(2);
    saveParams();
    updatePresetButtons();
  });

  sliderDamp.addEventListener('input', (e) => {
    const dampVal = parseFloat(e.target.value);
    DAMPING = 1 - dampVal;
    valDamp.textContent = dampVal.toFixed(4);
    saveParams();
  });

  btnReset.addEventListener('click', () => {
    theta = Math.PI / 4;
    omega = 0;
    trail.length = 0;
  });

  let gravityTransition = null;

  function smoothGravity(targetG) {
    const startG = g;
    const startTime = performance.now();
    const duration = 300;

    gravityTransition = { startG, targetG, startTime, duration };
  }

  function updateGravityTransition() {
    if (!gravityTransition) return;

    const { startG, targetG, startTime, duration } = gravityTransition;
    const elapsed = performance.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);

    g = startG + (targetG - startG) * eased;
    sliderG.value = g;
    valG.textContent = g.toFixed(2);

    if (progress >= 1) {
      g = targetG;
      gravityTransition = null;
      saveParams();
    }
  }

  const presetBtns = document.querySelectorAll('.btn-preset');

  function updatePresetButtons() {
    presetBtns.forEach(btn => {
      const btnG = parseFloat(btn.dataset.g);
      btn.classList.toggle('active', Math.abs(btnG - g) < 0.01);
    });
  }

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const targetG = parseFloat(btn.dataset.g);
      smoothGravity(targetG);
      presetBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  function physics() {
    const alpha = -(g / L) * Math.sin(theta);
    omega += alpha * DT;
    omega *= DAMPING;
    theta += omega * DT;
  }

  function bobPos() {
    return {
      x: pivotX + L * Math.sin(theta),
      y: pivotY + L * Math.cos(theta)
    };
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(80, 100, 140, 0.06)';
    ctx.lineWidth = 1;
    const step = 40;
    for (let x = 0; x < W; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function drawPivot() {
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#4a5a7a';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pivotX - 30, pivotY);
    ctx.lineTo(pivotX + 30, pivotY);
    ctx.strokeStyle = 'rgba(100, 130, 180, 0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawRod(bob) {
    const grad = ctx.createLinearGradient(pivotX, pivotY, bob.x, bob.y);
    grad.addColorStop(0, 'rgba(120, 150, 200, 0.4)');
    grad.addColorStop(1, 'rgba(120, 150, 200, 0.8)');
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(bob.x, bob.y);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawTrail(bob) {
    trail.push({ x: bob.x, y: bob.y });
    if (trail.length > MAX_TRAIL) trail.shift();

    for (let i = 0; i < trail.length - 1; i++) {
      const t = i / trail.length;
      ctx.beginPath();
      ctx.moveTo(trail[i].x, trail[i].y);
      ctx.lineTo(trail[i + 1].x, trail[i + 1].y);
      ctx.strokeStyle = `rgba(100, 220, 180, ${t * 0.35})`;
      ctx.lineWidth = t * 4;
      ctx.stroke();
    }
  }

  function drawBob(bob) {
    ctx.save();
    ctx.shadowColor = 'rgba(100, 240, 200, 0.9)';
    ctx.shadowBlur = 30;

    const grad = ctx.createRadialGradient(
      bob.x - 4, bob.y - 4, 2,
      bob.x, bob.y, BOB_RADIUS
    );
    grad.addColorStop(0, '#d0fff0');
    grad.addColorStop(0.4, '#6aecc0');
    grad.addColorStop(1, '#2a8a7a');

    ctx.beginPath();
    ctx.arc(bob.x, bob.y, BOB_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(bob.x, bob.y, BOB_RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(160, 255, 220, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawArcGuide() {
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, L, 0, Math.PI, false);
    ctx.strokeStyle = 'rgba(80, 110, 160, 0.08)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function updateHUD() {
    document.getElementById('h-len').textContent = L + ' px';
    document.getElementById('h-g').textContent = g.toFixed(2) + ' m/s²';
    document.getElementById('h-theta').textContent =
      (theta * 180 / Math.PI).toFixed(2) + '°';
    document.getElementById('h-omega').textContent =
      omega.toFixed(2) + ' rad/s';
  }

  function frame() {
    updateGravityTransition();
    physics();

    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);

    drawGrid();
    drawArcGuide();
    drawPivot();

    const bob = bobPos();
    drawTrail(bob);
    drawRod(bob);
    drawBob(bob);

    updateHUD();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
